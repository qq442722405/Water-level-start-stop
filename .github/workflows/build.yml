name: Windows EXE Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build directory EXE
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --windowed --name "WaterLevelAutoControl" --icon=app.ico --collect-all ddddocr --collect-all onnxruntime --hidden-import=onnxruntime --hidden-import=onnxruntime.capi._pybind_state main.py
          Copy-Item "app.ico" "dist\WaterLevelAutoControl\app.ico" -Force

      - name: Verify build
        shell: pwsh
        run: |
          if (-not (Test-Path "dist\WaterLevelAutoControl\WaterLevelAutoControl.exe")) {
            Write-Error "EXE 构建失败"
          }
          Get-ChildItem "dist\WaterLevelAutoControl" | Select-Object Name,Length

      - name: Package output directory
        shell: pwsh
        run: |
          # 使用英文目录名，避免 Windows Runner 中文路径编码问题
          if (Test-Path "水位数字自动控制-Windows.zip") { Remove-Item "水位数字自动控制-Windows.zip" -Force }
          Compress-Archive -Path "dist\WaterLevelAutoControl\*" -DestinationPath "水位数字自动控制-Windows.zip" -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: 水位数字自动控制-Windows
          path: 水位数字自动控制-Windows.zip
          if-no-files-found: error
