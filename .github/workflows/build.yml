name: Windows EXE Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build directory EXE
        shell: pwsh
        run: |
          # 使用纯英文输出目录，避免 GitHub Windows Runner 的中文路径编码问题
          pyinstaller --noconfirm --clean --windowed --name "WaterLevelAutoControl" --icon=app.ico --collect-all ddddocr --collect-all onnxruntime --hidden-import=onnxruntime --hidden-import=onnxruntime.capi._pybind_state main.py
          Copy-Item "app.ico" "dist\WaterLevelAutoControl\app.ico" -Force

      - name: Package output directory
        shell: pwsh
        run: |
          # 不使用中文目录路径，避免 Compress-Archive 找不到路径
          if (-not (Test-Path "dist\WaterLevelAutoControl")) {
            Write-Error "打包目录不存在：dist\WaterLevelAutoControl"
          }
          Compress-Archive -Path "dist\WaterLevelAutoControl\*" -DestinationPath "水位数字自动控制-Windows.zip" -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: 水位数字自动控制-Windows
          path: 水位数字自动控制-Windows.zip
          if-no-files-found: error
