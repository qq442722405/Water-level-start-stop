name: Windows EXE Build

on:
  workflow_dispatch:
  push:
    branches: ["main", "master"]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build directory EXE
        run: |
          pyinstaller --noconfirm --clean --windowed --name "水位数字自动控制" --icon=app.ico --collect-all ddddocr --collect-all onnxruntime --hidden-import=onnxruntime --hidden-import=onnxruntime.capi._pybind_state main.py
          copy app.ico "dist\水位数字自动控制\app.ico"

      - name: Package output directory
        shell: powershell
        run: |
          Compress-Archive -Path "dist\水位数字自动控制\*" -DestinationPath "水位数字自动控制-Windows.zip" -Force

      - name: Upload EXE folder
        uses: actions/upload-artifact@v4
        with:
          name: 水位数字自动控制-Windows
          path: 水位数字自动控制-Windows.zip
          if-no-files-found: error
